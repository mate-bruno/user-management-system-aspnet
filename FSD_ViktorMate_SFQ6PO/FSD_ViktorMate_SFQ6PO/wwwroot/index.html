<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Management App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Link for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div id="toastContainer">
    <!-- Shows toast messages using JavaScript -->
  </div>
  <button id="darkModeToggle"><i id="darkModeIcon" class="fa fa-moon-o" style="font-size: 16px"></i></button>

  <div class="header">
    <h1>User Manager Web Application</h1>
    <span>
      <input type="text" id="searchInput" placeholder="Search users..." />
      <button onclick="openCreateModal()"><i class="fa fa-plus"></i> New User</button>
    </span>
  </div>

  <!-- List users table -->
  <table id="userTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">ID</th>
        <th onclick="sortTable(1)">Full Name</th>
        <th onclick="sortTable(2)">Email</th>
        <th onclick="sortTable(3)">Date of Birth</th>
        <th onclick="sortTable(4)">Registration Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Table filled using JavaScript -->
    </tbody>
  </table>

  <!-- Edit User Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit User</h2>
      <form id="editUserForm">
        <input type="hidden" id="editUserId" /> <!-- PUT requires all parameters, but id and registrationDate are non-editable, hence they are hidden -->
        <input type="text" id="editFullName" placeholder="Full Name" required />
        <input type="email" id="editEmail" placeholder="E-mail" required />
        <input type="date" id="editBirthDate" required />
        <input type="hidden" id="editRegistrationDate" />
        <div class="buttons">
          <button type="submit">Save</button>
          <button type="button" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete User Modal -->
  <div id="deleteModal" class="modal">
    <input type="hidden" id="deleteUserId" /> <!-- DELETE requires id parameter, this input is used to pass it to JavaScript -->
    <div class="modal-content">
      <h2>Confirm Deletion</h2>
      <p>Are you sure you want to delete this user?</p>
      <div class="buttons">
        <button onclick="confirmDeleteUser()" class="delete-btn">Delete</button>
        <button onclick="closeDeleteModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Create New User Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <h2>Add New User</h2>
      <form id="createUserForm">
          <input type="text" id="createFullName" placeholder="Full Name" required />
          <input type="email" id="createEmail" placeholder="Email" required />
          <input type="date" id="createBirthDate" required />
          <div class="buttons">
            <button type="submit">Add</button>
            <button type="button" onclick="closeCreateModal()">Cancel</button>
          </div>  
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
